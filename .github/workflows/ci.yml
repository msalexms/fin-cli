name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Lint
        if: runner.os == 'Linux'
        run: make lint

      - name: Test
        run: go test ./... -count=1

      - name: Build
        run: go build -o bin/ ./cmd/fin-cli && ./bin/fin-cli --version
        shell: bash
